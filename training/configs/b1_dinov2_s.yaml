# B1: DINOv2 ViT-S/14 with registers (Apache-2.0 weights) at 224 px (16x16 patch grid).
# Lower reference LR for ViT fine-tuning. A1 data mix, 8 epochs.
name: b1_dinov2_s
input_size: 224
model:
  backbone: vit_small_patch14_reg4_dinov2.lvd142m
data:
  manifest_train: {FVC2000: 0.20, FVC2002: 0.20, l3sf: 0.15, TDFD: 0.05, SOCOFing: 0.25}
  socofing_drop_variants: [CR]
  synthetic_dir: data/synthetic_v2
  synthetic_weight: 0.15
optim:
  epochs: 8
  k: 1
  lr: 0.0002
